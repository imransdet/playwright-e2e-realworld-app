# =============================================================================
# Dev Branch CI
# =============================================================================
# Runs on pushes to `dev` branch for quick feedback during development.
# Includes lint, build, unit tests, AND Playwright E2E tests.
# Full PR validation (with preview deploy) happens in pr-validation.yml.
# =============================================================================

name: Dev Branch CI

on:
  push:
    branches: [dev]

concurrency:
  group: dev-ci-${{ github.sha }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ===========================================================================
  # Quick Lint & Type Check
  # ===========================================================================
  lint-and-typecheck:
    name: "Lint & Type Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        run: yarn eslint

      - name: Check Prettier formatting
        run: yarn prettier --check "**/**.{ts,js,tsx}" "*.{json,md,yml}"

      - name: TypeScript type check
        run: yarn types

  # ===========================================================================
  # Build Check
  # ===========================================================================
  build:
    name: "Build Check"
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build application
        run: yarn build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build/
          retention-days: 7

  # ===========================================================================
  # Unit Tests
  # ===========================================================================
  unit-tests:
    name: "Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run unit tests
        run: yarn test:unit:ci

  # ===========================================================================
  # Playwright E2E Tests (Full-Stack against local CI environment)
  # ===========================================================================
  e2e-tests:
    name: "E2E Tests (Playwright)"
    runs-on: ubuntu-latest
    needs: [build, unit-tests]
    timeout-minutes: 30
    env:
      BASE_URL: http://localhost:3000
      SEED_USERBASE_SIZE: 5
      SEED_CONTACTS_PER_USER: 3
      SEED_PAYMENTS_PER_USER: 15
      SEED_REQUESTS_PER_USER: 10
      SEED_BANK_ACCOUNTS_PER_USER: 1
      SEED_LIKES_PER_USER: 2
      SEED_COMMENTS_PER_USER: 2
      SEED_NOTIFICATIONS_PER_USER: 5
      SEED_BANK_TRANSFERS_PER_USER: 5
      SEED_DEFAULT_USER_PASSWORD: ${{ secrets.SEED_DEFAULT_USER_PASSWORD }}
      PAGINATION_PAGE_SIZE: 10
      PORT: 3000
      VITE_BACKEND_PORT: 3001
      NODE_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: build/

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium

      - name: Prepare mock AWS exports
        run: yarn predev:cognito:ci

      - name: Seed database
        run: yarn db:seed:dev

      - name: Start backend API server
        run: yarn start:api &

      - name: Start frontend proxy server
        run: yarn start:react:proxy-server &

      - name: Wait for servers to be ready
        run: npx wait-on http://localhost:3000 http://localhost:3001 --timeout 60000

      - name: Verify servers are responding
        run: |
          echo "Checking frontend..."
          curl -s -o /dev/null -w "Frontend: HTTP %{http_code}\n" http://localhost:3000
          echo "Checking backend..."
          curl -s -o /dev/null -w "Backend: HTTP %{http_code}\n" http://localhost:3001

      - name: Run Playwright E2E tests
        run: yarn test:headless --project=chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      - name: Upload test traces on failure
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 30