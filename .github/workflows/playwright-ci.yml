name: CI Pipeline

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: ESLint check
        run: yarn eslint
      - name: Prettier format check
        run: yarn prettier --check "**/**.{ts,js,tsx}" "*.{json,md,yml}"
      - name: TypeScript type check
        run: yarn types

  playwright-tests:
    name: Playwright Tests
    needs: lint-and-format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Install Playwright Browsers
        run: yarn playwright install --with-deps chromium
      - name: Seed database
        run: yarn db:seed:dev
      - name: Start backend server
        run: yarn start:api &
      - name: Start frontend server
        run: yarn start:react &
      - name: Wait for servers to be ready
        run: |
          npx wait-on http://localhost:3000 http://localhost:3001 --timeout 30000
      - name: Run Playwright tests
        run: yarn test:headless --project=chromium
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  auto-approve:
    name: Auto Approve PR
    needs: [lint-and-format, playwright-tests]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'dev'
    permissions:
      pull-requests: write
    steps:
      - name: Auto approve PR
        run: |
          gh pr review ${{ github.event.pull_request.number }} --approve --body "✅ All checks passed. Auto-approved for merge."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  auto-merge:
    name: Auto Merge to Main
    needs: [lint-and-format, playwright-tests]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'dev'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --merge --auto
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}