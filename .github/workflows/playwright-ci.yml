# =============================================================================
# Dev Branch CI - Quick Feedback
# =============================================================================
# Runs on pushes to `dev` branch for quick feedback during development.
# Full validation happens in pr-validation.yml when PR targets `main`.
# =============================================================================

name: Dev Branch CI

on:
  push:
    branches: [dev]

concurrency:
  group: dev-ci-${{ github.sha }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ===========================================================================
  # Quick Lint & Type Check
  # ===========================================================================
  lint-and-typecheck:
    name: "Lint & Type Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        run: yarn eslint

      - name: Check Prettier formatting
        run: yarn prettier --check "**/**.{ts,js,tsx}" "*.{json,md,yml}"

      - name: TypeScript type check
        run: yarn types

  # ===========================================================================
  # Build Check
  # ===========================================================================
  build:
    name: "Build Check"
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build application
        run: yarn build

  # ===========================================================================
  # Unit Tests
  # ===========================================================================
  unit-tests:
    name: "Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run unit tests
        run: yarn test:unit:ci
